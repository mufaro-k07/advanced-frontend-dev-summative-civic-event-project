<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City services · Sunshine 263</title>
  <script>
    // Put saved accessibility settings on before the page draws, so the old look never flashes
    (function () {
      try {
        const s = JSON.parse(localStorage.getItem('sunshine_a11y')) || {};
        const html = document.documentElement;
        if (s.textSize && s.textSize !== 'default') { html.setAttribute('data-text-size', s.textSize); }
        if (s.contrast === 'on') { html.setAttribute('data-contrast', 'high'); }
        if (s.motion === 'reduced') { html.setAttribute('data-motion', 'reduced'); }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../dist/output.css">
</head>
<body class="flex min-h-screen flex-col">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header" class="min-h-[61px] border-b border-line bg-white"></div>

  <main id="main" tabindex="-1" class="mx-auto flex w-full max-w-[1200px] flex-1 flex-col gap-10 px-4 py-12 md:px-8">
    <div>
      <p class="mb-2.5 text-sm font-bold tracking-[0.12em] text-flame uppercase">City services</p>
      <h1 class="text-[2.5rem] leading-none font-extrabold tracking-[-0.03em] md:text-[3.75rem]">Something wrong in your street?</h1>
      <p class="mt-3.5 max-w-[640px] text-lg text-ink-soft">Tell the city team. You can follow your request here from submitted to resolved.</p>
    </div>

    <form id="service-form" class="card-border flex flex-col gap-6 rounded-card border border-line bg-white p-5 md:p-8" novalidate>
      <div id="form-error" role="alert" class="hidden rounded-control border border-error bg-white p-4 text-error"></div>

      <fieldset id="service-type-group" aria-describedby="service-type-hint service-type-error">
        <legend class="mb-1 font-heading text-[1.375rem] font-bold">1. What kind of problem is it?</legend>
        <p id="service-type-hint" class="mb-4 text-[0.9375rem] text-ink-soft">Pick the closest one.</p>
        <div id="type-options"></div>
        <p id="service-type-error" class="field-error hidden" aria-live="polite"></p>
      </fieldset>

      <fieldset class="flex flex-col gap-4">
        <legend class="mb-3 font-heading text-[1.375rem] font-bold">2. Tell us the details</legend>
        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label for="title" class="field-label">Short title</label>
            <input id="title" name="title" type="text" maxlength="150" required
                   placeholder="e.g. Streetlight out on Second Street"
                   aria-describedby="title-error" class="field-input min-h-[50px]">
            <p id="title-error" class="field-error hidden" aria-live="polite"></p>
          </div>
          <div>
            <label for="location" class="field-label">Where is it?</label>
            <input id="location" name="location" type="text" maxlength="200" required
                   placeholder="Street and suburb, or a nearby landmark"
                   aria-describedby="location-error" class="field-input min-h-[50px]">
            <p id="location-error" class="field-error hidden" aria-live="polite"></p>
          </div>
        </div>
        <div>
          <label for="description" class="field-label">What's happening? <span class="font-normal text-ink-soft">(optional)</span></label>
          <textarea id="description" name="description" rows="4" maxlength="1000"
                    placeholder="What's wrong and since when?"
                    aria-describedby="description-error" class="field-input resize-y py-3"></textarea>
          <p id="description-error" class="field-error hidden" aria-live="polite"></p>
        </div>
      </fieldset>

      <div class="flex flex-wrap items-center gap-4">
        <button type="submit" id="send-button" class="btn btn-accent min-h-[54px] px-7 text-base font-bold">
          <span class="js-button-label">Send request</span>
        </button>
        <p class="text-sm text-ink-soft">You'll get a notification when the status changes.</p>
      </div>
    </form>

    <section aria-labelledby="requests-heading">
      <h2 id="requests-heading" class="mb-4 text-[2rem] font-extrabold tracking-[-0.02em] text-ink">Your requests</h2>
      <div id="my-requests"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/guards.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/a11y.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/services.js"></script>
</body>
</html>
