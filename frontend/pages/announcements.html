<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements · Sunshine 263</title>
  <script>
    // Put saved accessibility settings on before the page draws, so the old look never flashes
    (function () {
      try {
        const s = JSON.parse(localStorage.getItem('sunshine_a11y')) || {};
        const html = document.documentElement;
        if (s.textSize && s.textSize !== 'default') { html.setAttribute('data-text-size', s.textSize); }
        if (s.contrast === 'on') { html.setAttribute('data-contrast', 'high'); }
        if (s.motion === 'reduced') { html.setAttribute('data-motion', 'reduced'); }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../dist/output.css">
</head>
<body class="flex min-h-screen flex-col">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header" class="min-h-[61px] border-b border-line bg-white"></div>

  <main id="main" tabindex="-1" class="mx-auto w-full max-w-[1200px] flex-1 px-4 py-8 md:px-8">
    <div class="mb-8 flex flex-wrap items-end justify-between gap-4">
      <div>
        <!-- The serif accent only kicks in from 32px up, as the style guide says -->
        <h1 class="text-[1.75rem] font-extrabold md:text-[2rem]">Listen to Harare</h1>
        <p class="mt-1 max-w-2xl text-ink-soft">Short audio updates from the city. Press play right here, or open one for the full player.</p>
      </div>
      <!-- Filled in for admins only -->
      <div id="admin-actions"></div>
    </div>

    <!-- Heading for screen reader users, so the cards' h3s sit under an h2 -->
    <h2 class="sr-only">All announcements</h2>
    <div id="announcement-list"></div>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/guards.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/a11y.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/cards.js"></script>
  <script src="../js/player.js"></script>
  <script src="../js/media-admin.js"></script>
  <script src="../js/pages/announcements.js"></script>
</body>
</html>
