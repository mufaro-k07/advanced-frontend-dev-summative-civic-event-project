<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications · Sunshine 263</title>
  <script>
    // Put saved accessibility settings on before the page draws, so the old look never flashes
    (function () {
      try {
        const s = JSON.parse(localStorage.getItem('sunshine_a11y')) || {};
        const html = document.documentElement;
        if (s.textSize && s.textSize !== 'default') { html.setAttribute('data-text-size', s.textSize); }
        if (s.contrast === 'on') { html.setAttribute('data-contrast', 'high'); }
        if (s.motion === 'reduced') { html.setAttribute('data-motion', 'reduced'); }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../dist/output.css">
</head>
<body class="flex min-h-screen flex-col">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header" class="min-h-[61px] border-b border-line bg-white"></div>

  <main id="main" tabindex="-1" class="mx-auto w-full max-w-[1200px] flex-1 px-4 py-8 md:px-8">
    <h1 class="text-[1.75rem] font-extrabold md:text-[2rem]">Notifications</h1>
    <p class="mt-1 mb-6 text-ink-soft">New events, announcements and promos, newest first.</p>

    <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
      <fieldset>
        <legend class="field-label">Show</legend>
        <div class="flex gap-2">
          <label class="cursor-pointer">
            <input type="radio" name="show" value="all" class="peer sr-only" checked>
            <span class="flex min-h-11 items-center rounded-control border-2 border-lily-teal px-4 font-semibold text-lily-teal peer-checked:bg-lily-teal peer-checked:text-white peer-focus-visible:outline-3 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-solid peer-focus-visible:outline-lily-teal">All</span>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="show" value="unread" class="peer sr-only">
            <span class="flex min-h-11 items-center rounded-control border-2 border-lily-teal px-4 font-semibold text-lily-teal peer-checked:bg-lily-teal peer-checked:text-white peer-focus-visible:outline-3 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-solid peer-focus-visible:outline-lily-teal">Unread only</span>
          </label>
        </div>
      </fieldset>
      <button type="button" id="mark-all" class="btn btn-secondary">Mark all as read</button>
    </div>

    <p id="inbox-summary" aria-live="polite" class="mb-4 font-semibold"></p>
    <div id="inbox"></div>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/guards.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/a11y.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/notifications.js"></script>
</body>
</html>
