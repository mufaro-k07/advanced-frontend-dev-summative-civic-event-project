<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · Sunshine 263</title>
  <script>
    // Put saved accessibility settings on before the page draws, so the old look never flashes
    (function () {
      try {
        const s = JSON.parse(localStorage.getItem('sunshine_a11y')) || {};
        const html = document.documentElement;
        if (s.textSize && s.textSize !== 'default') { html.setAttribute('data-text-size', s.textSize); }
        if (s.contrast === 'on') { html.setAttribute('data-contrast', 'high'); }
        if (s.motion === 'reduced') { html.setAttribute('data-motion', 'reduced'); }
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="Log in to Sunshine 263 to find events, announcements and promos across Harare.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="bg-teal-deep">
  <a href="#main" class="skip-link">Skip to content</a>

  <!-- Full flame lily photo behind everything, with a teal fade that gets darker towards the form.
       The photo is a CSS background, so if it's missing you still get the dark teal. -->
  <div class="on-dark relative flex min-h-screen flex-col overflow-hidden bg-teal-deep bg-[url('../assets/images/flame-lily.jpg')] bg-cover bg-[30%_40%] text-white">
    <div aria-hidden="true" class="absolute inset-0 bg-linear-to-r from-teal-deep/35 via-teal-deep/75 via-60% to-teal-deep/90"></div>

    <header class="relative z-20 mx-auto flex w-full max-w-[1360px] items-center justify-between gap-3 px-4 py-6 md:px-10 md:py-8">
      <a href="index.html" aria-label="Sunshine 263 home" class="inline-flex min-h-11 items-center gap-2.5 rounded-control">
        <img src="assets/images/flame-lily.jpg" alt="" aria-hidden="true" class="h-9 w-9 rounded-full object-cover object-[50%_36%] ring-2 ring-sunshine">
        <img src="assets/icons/logo-wordmark-light.svg" alt="" aria-hidden="true" class="h-6 w-auto">
      </a>
      <div id="a11y-slot"></div>
    </header>

    <div class="relative mx-auto flex w-full max-w-[1360px] flex-1 flex-wrap items-stretch gap-12 px-4 pt-2 pb-14 md:px-10">
      <!-- The yellow frame with the huge words. The words hang over the bottom edge on purpose. -->
      <div class="flex min-h-48 max-w-full flex-[1_1_520px] flex-col justify-end overflow-x-clip border-2 border-sunshine lg:min-h-[600px]">
        <p class="-mb-1.5 translate-y-6 font-heading font-stretch-condensed text-[4rem] leading-[0.82] font-extrabold text-sunshine uppercase sm:text-[6rem] lg:translate-y-8 xl:text-[9.375rem]">Welcome<br>back.</p>
      </div>

      <main id="main" tabindex="-1" class="on-light w-full max-w-[460px] flex-[0_1_460px] self-center">
        <div class="rounded-card bg-white p-6 text-ink md:p-9">
          <h1 class="text-[1.75rem] font-extrabold tracking-[-0.02em] md:text-[2rem]">Log in</h1>
          <p class="mt-1.5 text-[0.9375rem] text-ink-soft">See what's on in Harare this week.</p>

          <!-- Filled in when someone is sent here, e.g. after their login expires -->
          <div id="login-notice" class="mt-5 hidden"></div>

          <div id="form-error" role="alert" class="mt-5 hidden rounded-input border border-error bg-white p-4 text-error"></div>

          <form id="login-form" class="mt-5 flex flex-col gap-4.5" novalidate>
            <div>
              <label for="email" class="field-label font-bold">Email address</label>
              <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"
                     aria-describedby="email-error" class="field-input min-h-12">
              <p id="email-error" class="field-error hidden" aria-live="polite"></p>
            </div>

            <div>
              <div class="flex items-end justify-between">
                <label for="password" class="field-label font-bold">Password</label>
                <button type="button" id="toggle-password" aria-controls="password" aria-pressed="false"
                        class="min-h-11 rounded-control px-2 text-sm font-bold text-lily-teal underline underline-offset-2 hover:text-teal-deep aria-pressed:bg-mist">
                  Show password
                </button>
              </div>
              <input id="password" name="password" type="password" autocomplete="current-password" required
                     aria-describedby="password-error" class="field-input min-h-12">
              <p id="password-error" class="field-error hidden" aria-live="polite"></p>
            </div>

            <label class="flex cursor-pointer items-start gap-2.5 text-[0.9375rem]">
              <input id="remember" type="checkbox" class="mt-0.5 h-5 w-5 shrink-0 accent-lily-teal">
              <span>
                <strong>Keep me logged in</strong>
                <span class="block text-[0.8125rem] text-ink-soft">Skip this on a shared computer.</span>
              </span>
            </label>

            <button type="submit" id="login-button" class="btn btn-primary min-h-[54px] w-full text-base font-bold">
              <span class="js-button-label">Log in</span> <span aria-hidden="true">→</span>
            </button>
          </form>

          <p class="mt-4.5 text-center text-[0.9375rem] text-ink-soft">
            New to Sunshine 263?
            <a href="signup.html" class="font-bold text-lily-teal underline underline-offset-2 hover:text-teal-deep">Create an account</a>
          </p>
        </div>
      </main>
    </div>

    <footer class="relative px-4 pb-6 text-center text-[0.8125rem] text-mist md:px-10">
      <p>A student project. Not affiliated with the City of Harare.</p>
    </footer>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/guards.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
