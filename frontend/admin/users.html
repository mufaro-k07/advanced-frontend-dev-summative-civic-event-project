<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users · Sunshine 263</title>
  <script>
    // Put saved accessibility settings on before the page draws, so the old look never flashes
    (function () {
      try {
        const s = JSON.parse(localStorage.getItem('sunshine_a11y')) || {};
        const html = document.documentElement;
        if (s.textSize && s.textSize !== 'default') { html.setAttribute('data-text-size', s.textSize); }
        if (s.contrast === 'on') { html.setAttribute('data-contrast', 'high'); }
        if (s.motion === 'reduced') { html.setAttribute('data-motion', 'reduced'); }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../dist/output.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <div class="min-h-screen md:flex">
    <div id="admin-sidebar" class="bg-teal-deep md:w-[248px]"></div>

    <div class="flex min-w-0 flex-1 flex-col">
      <div id="site-header" class="min-h-[61px] border-b border-mist bg-white"></div>

      <main id="main" tabindex="-1" class="w-full max-w-[1200px] flex-1 px-4 py-8 md:px-8">
        <h1 class="text-[1.75rem] font-extrabold md:text-[2rem]">Users</h1>
        <p class="mt-1 mb-6 text-ink-soft">Everyone with a Sunshine 263 account. Open someone to enable or disable them.</p>

        <form id="user-filters" role="search" aria-label="Find users" class="card-border mb-6 grid gap-4 rounded-panel border border-mist bg-white p-5 shadow-sm md:grid-cols-[2fr_1fr_1fr]">
          <div>
            <label for="search" class="field-label">Search by name or email</label>
            <input id="search" type="search" autocomplete="off" class="field-input">
          </div>
          <div>
            <label for="role" class="field-label">Role</label>
            <select id="role" class="field-input">
              <option value="all">Everyone</option>
              <option value="user">Residents</option>
              <option value="admin">Admins</option>
            </select>
          </div>
          <div>
            <label for="status" class="field-label">Status</label>
            <select id="status" class="field-input">
              <option value="all">Any status</option>
              <option value="active">Active</option>
              <option value="disabled">Disabled</option>
            </select>
          </div>
        </form>

        <p id="results-summary" aria-live="polite" class="mb-4 font-semibold"></p>
        <div id="user-list"></div>
      </main>

      <div id="site-footer"></div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/guards.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/a11y.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/cards.js"></script>
  <script src="../js/pages/users.js"></script>
</body>
</html>
