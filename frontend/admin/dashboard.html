<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin overview · Sunshine 263</title>
  <script>
    // Put saved accessibility settings on before the page draws, so the old look never flashes
    (function () {
      try {
        const s = JSON.parse(localStorage.getItem('sunshine_a11y')) || {};
        const html = document.documentElement;
        if (s.textSize && s.textSize !== 'default') { html.setAttribute('data-text-size', s.textSize); }
        if (s.contrast === 'on') { html.setAttribute('data-contrast', 'high'); }
        if (s.motion === 'reduced') { html.setAttribute('data-motion', 'reduced'); }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../dist/output.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <div class="min-h-screen md:flex">
    <div id="admin-sidebar" class="bg-teal-deep md:w-[248px]"></div>

    <div class="flex min-w-0 flex-1 flex-col">
      <div id="site-header" class="min-h-[61px] border-b border-mist bg-white"></div>

      <main id="main" tabindex="-1" class="w-full max-w-[1200px] flex-1 px-4 py-8 md:px-8">
        <div class="mb-8 flex flex-wrap items-end justify-between gap-4">
          <div>
            <h1 class="text-[1.75rem] font-extrabold md:text-[2rem]">Admin overview</h1>
            <p class="mt-1 text-ink-soft">Welcome back, <span id="user-name">admin</span>. Here's how Sunshine 263 is doing.</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <a href="event-form.html" class="btn btn-primary">Add an event</a>
            <a href="users.html" class="btn btn-secondary">Manage users</a>
          </div>
        </div>

        <section aria-labelledby="numbers-heading" class="mb-10">
          <h2 id="numbers-heading" class="mb-4 text-2xl font-bold">The numbers</h2>
          <div id="admin-stats"></div>
        </section>

        <div class="grid gap-6 lg:grid-cols-[3fr_2fr]">
          <section aria-labelledby="growth-heading" class="card-border rounded-panel border border-mist bg-white p-6 shadow-sm">
            <h2 id="growth-heading" class="mb-1 text-2xl font-bold">New sign-ups</h2>
            <p class="mb-6 text-sm text-ink-soft">People who joined in each of the last six months.</p>
            <div id="growth-chart"></div>
          </section>

          <section aria-labelledby="people-heading" class="card-border rounded-panel border border-mist bg-white p-6 shadow-sm">
            <h2 id="people-heading" class="mb-1 text-2xl font-bold">Accounts</h2>
            <p class="mb-6 text-sm text-ink-soft">One dot for each account.</p>
            <div id="user-dots"></div>
          </section>
        </div>
      </main>

      <div id="site-footer"></div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/guards.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/a11y.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/admin-dashboard.js"></script>
</body>
</html>
